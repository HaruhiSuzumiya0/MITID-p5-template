<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧚🏻p5js🧚🏻</title>

    <link href="style.css" rel="stylesheet" />

    <!-- p5 libs -->
    <!-- librairies are added locally in case we don't have access to wifi -->
    <script src="libraries/p5.js"         type="text/javascript"></script>
    <script src="libraries/p5Sound.js"    type="text/javascript"></script>
    <!-- <script src="libraries/matter.js"    type="text/javascript"></script> -->
    <!-- <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>-->
    
    <script src="script.js" type="text/javascript" defer></script>
</head>
<body>
    <main>
        <!-- p5 canvas is attached here -->
    </main>

    <button id="randomize">generate</button>

    <button id="stop">stop</button>
    
    <div id="nbControl">
                <label for="size">change number of stacks</label>
                <input 
                    type="range" 
                    id="nb"
                    min="1"
                    max="100"
                    step="1">
            </div>

    <div id="circlesControl">
                <label for="circles">change number of circles per stack</label>
                <input
                    type="range"
                    id="circles"
                    min="1"
                    max="50"
                    step="1">
            </div>

    <div id="squaresControl">
                <label for="squares">change number of squares per stack</label>
                <input
                    type="range"
                    id="squares"
                    min="1"
                    max="50"
                    step="1">
            </div>

</body>
</html>
